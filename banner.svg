<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Lumen</title>
  <desc id="desc">Lumen: every long read, distilled to what matters.</desc>
  <defs>
    <radialGradient id="glow" cx="80%" cy="0%" r="80%">
      <stop offset="0" stop-color="#C8A96A" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="12%" cy="100%" r="55%">
      <stop offset="0" stop-color="#0F3D33" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F1E8"/>
      <stop offset="0.5" stop-color="#E6D3A3"/>
      <stop offset="1" stop-color="#C8A96A"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6D3A3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8F7638" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="#0A0A0B"/>
  <rect width="1200" height="340" fill="url(#glow)"/>
  <rect width="1200" height="340" fill="url(#glow2)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#C8A96A" stroke-opacity="0.35"/>

  <!-- Prism, left -->
  <g fill="none" stroke="url(#facet)" stroke-width="1.6" opacity="0.85">
    <polygon points="150,70 215,170 150,270 85,170"/>
    <polygon points="150,70 215,170 85,170" fill="#C8A96A" fill-opacity="0.07"/>
    <line x1="150" y1="70" x2="150" y2="270"/>
    <polygon points="150,112 188,170 150,228 112,170" stroke-opacity="0.5"/>
  </g>

  <!-- Prism, right -->
  <g fill="none" stroke="url(#facet)" stroke-width="1.6" opacity="0.55">
    <polygon points="1050,100 1100,170 1050,240 1000,170"/>
    <polygon points="1050,100 1100,170 1000,170" fill="#C8A96A" fill-opacity="0.06"/>
    <line x1="1050" y1="100" x2="1050" y2="240"/>
  </g>

  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="92" letter-spacing="30" fill="url(#gold)">LUMEN</text>
  <line x1="470" y1="204" x2="730" y2="204" stroke="#C8A96A" stroke-opacity="0.65"/>
  <text x="600" y="246" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" letter-spacing="4" fill="#A8A398">EVERY LONG READ, DISTILLED TO WHAT MATTERS</text>
</svg>
